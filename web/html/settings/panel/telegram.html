{{define "settings/panel/telegram"}}
<a-collapse default-active-key="1">
    <a-collapse-panel key="1" header='{{ i18n "pages.xray.generalConfigs"}}'>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.telegramBotEnable" }}</template>
            <template #description>{{ i18n "pages.settings.telegramBotEnableDesc" }}</template>
            <template #control>
                <a-switch v-model="allSetting.tgBotEnable"></a-switch>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.telegramToken"}}</template>
            <template #description>{{ i18n "pages.settings.telegramTokenDesc"}}</template>
            <template #control>
                <a-input type="text" v-model="allSetting.tgBotToken"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.telegramChatId"}}</template>
            <template #description>{{ i18n "pages.settings.telegramChatIdDesc"}}</template>
            <template #control>
                <a-input type="text" v-model="allSetting.tgBotChatId"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.telegramBotLanguage"}}</template>
            <template #control>
                <a-select ref="selectBotLang" v-model="allSetting.tgLang"
                    :dropdown-class-name="themeSwitcher.currentTheme" :style="{ width: '100%' }">
                    <a-select-option :value="l.value" :label="l.value" v-for="l in LanguageManager.supportedLanguages">
                        <span role="img" :aria-label="l.name" v-text="l.icon"></span> &nbsp;&nbsp; <span
                            v-text="l.name"></span>
                    </a-select-option>
                </a-select>
            </template>
        </a-setting-list-item>
    </a-collapse-panel>
    <a-collapse-panel key="2" header='{{ i18n "pages.settings.notifications" }}'>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.telegramNotifyTime"}}</template>
            <template #description>{{ i18n "pages.settings.telegramNotifyTimeDesc"}}</template>
            <template #control>
                <a-input type="text" v-model="allSetting.tgRunTime"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.tgNotifyBackup" }}</template>
            <template #description>{{ i18n "pages.settings.tgNotifyBackupDesc" }}</template>
            <template #control>
                <a-switch v-model="allSetting.tgBotBackup"></a-switch>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.tgNotifyLogin" }}</template>
            <template #description>{{ i18n "pages.settings.tgNotifyLoginDesc" }}</template>
            <template #control>
                <a-switch v-model="allSetting.tgBotLoginNotify"></a-switch>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Expiry reminder schedule</template>
            <template #description>How often the panel checks customer expiry reminders. Example: @every 10m</template>
            <template #control><a-input v-model="allSetting.tgExpiryReminderRuntime"></a-input></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Reminder before expiry (days)</template>
            <template #description>Two-stage reminders: the first and final warning windows.</template>
            <template #control>
                <a-input-number :min="1" v-model="allSetting.tgExpiryReminder2Days" :style="{ width: '48%', marginRight: '4%' }"></a-input-number>
                <a-input-number :min="1" v-model="allSetting.tgExpiryReminder1Day" :style="{ width: '48%' }"></a-input-number>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Notify when expired</template>
            <template #control><a-switch v-model="allSetting.tgExpiryReminderOnExpire"></a-switch></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Customer self-service renewal</template>
            <template #description>Allow linked Telegram users to choose a plan and submit a payment receipt for admin approval.</template>
            <template #control><a-switch v-model="allSetting.tgRenewalEnable"></a-switch></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Renewal payment information</template>
            <template #description>Card/account/payment instructions shown to customers before they send a receipt.</template>
            <template #control><a-textarea v-model="allSetting.tgRenewalPaymentInfo" :auto-size="{ minRows: 2, maxRows: 6 }"></a-textarea></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Renewal plans (JSON)</template>
            <template #description>Array of {id,name,gb,days,price}. gb=0 means unlimited. Example: [{"id":"10gb-30d","name":"10 GB / 30 days","gb":10,"days":30,"price":"100000"}]</template>
            <template #control><a-textarea v-model="allSetting.tgRenewalPlans" :auto-size="{ minRows: 5, maxRows: 12 }"></a-textarea></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.tgNotifyCpu" }}</template>
            <template #description>{{ i18n "pages.settings.tgNotifyCpuDesc" }}</template>
            <template #control>
                <a-input-number :min="0" :max="100" v-model="allSetting.tgCpu" :style="{ width: '100%' }"></a-input-number>
            </template>
        </a-setting-list-item>
    </a-collapse-panel>
    <a-collapse-panel key="4" header="WhatsApp Cloud API">
        <a-setting-list-item paddings="small">
            <template #title>Enable WhatsApp notifications</template>
            <template #description>Official Meta WhatsApp Cloud API. Customers link their number by sending START followed by their account email.</template>
            <template #control><a-switch v-model="allSetting.waEnable"></a-switch></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Access token</template>
            <template #control><a-input-password v-model="allSetting.waAccessToken"></a-input-password></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Phone Number ID</template>
            <template #control><a-input v-model="allSetting.waPhoneNumberId"></a-input></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Webhook verify token</template>
            <template #description>Use the same value when configuring Meta webhook verification.</template>
            <template #control><a-input v-model="allSetting.waVerifyToken"></a-input></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>App Secret</template>
            <template #description>Used to verify X-Hub-Signature-256 on incoming webhooks.</template>
            <template #control><a-input-password v-model="allSetting.waAppSecret"></a-input-password></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Graph API version</template>
            <template #control><a-input v-model="allSetting.waGraphVersion"></a-input></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Reminder schedule</template>
            <template #description>Example: @every 10m</template>
            <template #control><a-input v-model="allSetting.waExpiryReminderRuntime"></a-input></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>2-day approved template name</template>
            <template #description>Meta-approved template with one body variable, for example {{1}}.</template>
            <template #control><a-input v-model="allSetting.waExpiryTemplate2Days"></a-input></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>1-day approved template name</template>
            <template #control><a-input v-model="allSetting.waExpiryTemplate1Day"></a-input></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Expired approved template name</template>
            <template #control><a-input v-model="allSetting.waExpiryTemplateExpired"></a-input></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Template language</template>
            <template #control><a-input v-model="allSetting.waTemplateLanguage"></a-input></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>2-day custom message variable</template>
            <template #description>Placeholders: {email}, {days}, {expiry}, {remaining_traffic}. This text is sent as the first template body variable.</template>
            <template #control><a-textarea v-model="allSetting.waExpiryText2Days" :auto-size="{ minRows: 2, maxRows: 5 }"></a-textarea></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>1-day custom message variable</template>
            <template #control><a-textarea v-model="allSetting.waExpiryText1Day" :auto-size="{ minRows: 2, maxRows: 5 }"></a-textarea></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Expired custom message variable</template>
            <template #control><a-textarea v-model="allSetting.waExpiryTextExpired" :auto-size="{ minRows: 2, maxRows: 5 }"></a-textarea></template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Customer setup</template>
            <template #description>Customer sends START email@example.com to your WhatsApp Business number. STOP unlinks the number.</template>
            <template #control><a-tag color="blue">/whatsapp/webhook</a-tag></template>
        </a-setting-list-item>
    </a-collapse-panel>
    <a-collapse-panel key="3" header='{{ i18n "pages.settings.proxyAndServer" }}'>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.telegramProxy"}}</template>
            <template #description>{{ i18n "pages.settings.telegramProxyDesc"}}</template>
            <template #control>
                <a-input type="text" placeholder="socks5://user:pass@host:port"
                    v-model="allSetting.tgBotProxy"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.telegramAPIServer"}}</template>
            <template #description>{{ i18n "pages.settings.telegramAPIServerDesc"}}</template>
            <template #control>
                <a-input type="text" placeholder="https://api.example.com"
                    v-model="allSetting.tgBotAPIServer"></a-input>
            </template>
        </a-setting-list-item>
    </a-collapse-panel>
</a-collapse>
{{end}}
