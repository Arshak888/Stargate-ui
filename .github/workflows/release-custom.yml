name: Build custom release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true

      - name: Build vpn-ui
        run: |
          chmod +x build.sh
          ./build.sh --arch amd64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.9.4-custom.${GITHUB_RUN_NUMBER}"
          gh release create "$VERSION" \
            "build/out/vpn-ui-amd64" \
            --title "$VERSION" \
            --notes "Custom vpn-ui build from commit $GITHUB_SHA." \
            --latest